[project]
name = "sensor-fault-detection"
version = "0.1.0"
description = "The goal of this project is to provide a data-driven approach for early detection of Air Pressure System (APS) failures in Scania trucks, which can assist fleet operators and maintenance teams in preventing critical breakdowns, reducing downtime, and enhancing road safety."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "certifi>=2026.10.19",
    "dill>=0.4.1",
    "evidently>=0.7.23,<0.8.0",
    "pandas>=2.2.3,<3.0.0",
    "from-root>=1.3.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "ipykernel>=7.4.0",
    "imblearn>=0.0",
    "neuro-mf>=0.0.5",
    "botocore>=1.43.118",
    "mypy-boto3-s3>=1.43.106",
    "boto3>=1.43.118",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"